name: Zero-Downtime Blue/Green Deployment

on:
  push:
    tags:
      - '*.*.*' # Trigger deployment on version tags like v1.0.0

jobs:
  deploy:
    runs-on: self-hosted # Atau runner Linux kamu di VPS produksi
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Detect Current Active Container
        id: detect-env
        run: |
          # Cek container mana yang sedang aktif di NGINX saat ini
          CURRENT_ACTIVE=$(docker inspect --format='{{range .Config.Env}}{{println .}}{{end}}' nginx-proxy 2>/dev/null | grep ACTIVE_TARGET || echo "ACTIVE_TARGET=blue")
          
          if [[ "$CURRENT_ACTIVE" == *"green"* ]]; then
            echo "inactive_env=blue" >> $GITHUB_OUTPUT
            echo "active_container=app_blue" >> $GITHUB_OUTPUT
            echo "inactive_port=8001" >> $GITHUB_OUTPUT
          else
            echo "inactive_env=green" >> $GITHUB_OUTPUT
            echo "active_container=app_green" >> $GITHUB_OUTPUT
            echo "inactive_port=8002" >> $GITHUB_OUTPUT
          fi

      - name: Build and Start Inactive Environment
        run: |
          INACTIVE_ENV="${{ steps.detect-env.outputs.inactive_env }}"
          echo "Building and starting app-$INACTIVE_ENV..."
          docker compose up -d --build app-$INACTIVE_ENV

      - name: Automated Health Check
        run: |
          INACTIVE_PORT="${{ steps.detect-env.outputs.inactive_port }}"
          MAX_RETRIES=5
          RETRY_COUNT=0
          HEALTHY=false

          echo "Checking health on port $INACTIVE_PORT..."
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              RESPONSE=$(curl -s http://localhost:$INACTIVE_PORT/health || true)
              echo "Health check response: $RESPONSE"
              if [[ "$RESPONSE" == *"ok"* ]]; then
                  echo "Health check passed!"
                  HEALTHY=true
                  break
              else
                  echo "Application starting... retrying ($((RETRY_COUNT+1))/$MAX_RETRIES)"
                  sleep 3
                  RETRY_COUNT=$((RETRY_COUNT+1))
              fi
          done

          if [ "$HEALTHY" = false ]; then
              echo "Health check failed! Rolling back/stopping deployment."
              exit 1
          fi

      - name: Switch NGINX Upstream Traffic
        env:
          ACTIVE_CONTAINER: ${{ steps.detect-env.outputs.active_container }}
        run: |
          echo "Switching NGINX traffic to $ACTIVE_CONTAINER..."
          
          # Render template NGINX
          export ACTIVE_CONTAINER
          envsubst '$ACTIVE_CONTAINER' < nginx.conf.template > nginx/nginx.conf

          # Salin ke container NGINX dan reload secara graceful
          docker cp nginx/nginx.conf nginx-proxy:/etc/nginx/conf.d/default.conf
          docker exec nginx-proxy nginx -s reload
          
          echo "Deployment completed successfully with Zero-Downtime!"