services:
  app-blue:
    build: .
    container_name: app-blue
    environment:
      - APP_VERSION=1.0.0-BLUE
      - ENVIRONMENT=blue
    networks:
      - app-network

  app-green:
    build: .
    container_name: app-green
    environment:
      - APP_VERSION=1.0.0-GREEN
      - ENVIRONMENT=green
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: 
      - app-blue
      - app-green
    networks:
      - app-network

networks:
  app-network:
   driver: bridge