services:
  app-blue:
    build: .
    container_name: app-blue
    ports:
      - "8001:8000"
    environment:
      - APP_VERSION=1.0.0-BLUE
      - ENVIRONMENT=blue
    networks:
      - app-network

  app-green:
    build: .
    container_name: app-green
    ports:
      - "8002:8000"
    environment:
      - APP_VERSION=2.0.0-GREEN
      - ENVIRONMENT=green
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d
    depends_on: 
      - app-blue
      - app-green
    networks:
      - app-network

networks:
  app-network:
   driver: bridge